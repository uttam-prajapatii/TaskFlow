services:
  # ==========================================
  # Database Service (MongoDB)
  # ==========================================
  mongodb:
    image: mongo:6.0
    container_name: taskflow_mongodb_dev
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data_dev:/data/db
    networks:
      - taskflow_network

  # ==========================================
  # Caching Service (Redis)
  # ==========================================
  redis:
    image: redis:7.0-alpine
    container_name: taskflow_redis_dev
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    networks:
      - taskflow_network

  # ==========================================
  # Backend API Service (Development)
  # ==========================================
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile.dev
    container_name: taskflow_backend_dev
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/taskflow
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./Backend:/app
      - /app/node_modules
    depends_on:
      - mongodb
      - redis
    networks:
      - taskflow_network

  # ==========================================
  # Frontend UI Service (Development)
  # ==========================================
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile.dev
    container_name: taskflow_frontend_ui_dev
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./Frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - taskflow_network

# ==========================================
# Persistent volumes config
# ==========================================
volumes:
  mongo_data_dev:
  redis_data_dev:

# ==========================================
# Network configuration
# ==========================================
networks:
  taskflow_network:
    driver: bridge
