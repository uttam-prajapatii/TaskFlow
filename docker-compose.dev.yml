services:
  # ==========================================
  # Database Service (MongoDB)
  # ==========================================
  mongodb:
    image: mongo:6.0
    container_name: taskflow_mongodb_dev
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo_data_dev:/data/db
    networks:
      - taskflow_network

  # ==========================================
  # Caching Service (Redis)
  # ==========================================
  redis:
    image: redis:7.0-alpine
    container_name: taskflow_redis_dev
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data_dev:/data
    networks:
      - taskflow_network

  # ==========================================
  # Backend API Service (Development)
  # ==========================================
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile.dev
    container_name: taskflow_backend_dev
    restart: always
    command: bunx nodemon -L --exec bun src/server.js
    ports:
      - '${BACKEND_PORT:-5000}:5000'
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=5000
      - MONGO_URI=${MONGO_URI}
      - REDIS_URL=${REDIS_URL}
      - EMAIL_LOGO_URL=${EMAIL_LOGO_URL}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_ACCESS_EXPIRY=${JWT_ACCESS_EXPIRY}
      - JWT_REFRESH_EXPIRY=${JWT_REFRESH_EXPIRY}
      - JWT_ACCESS_COOKIE_NAME=${JWT_ACCESS_COOKIE_NAME}
      - JWT_REFRESH_COOKIE_NAME=${JWT_REFRESH_COOKIE_NAME}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    volumes:
      - ./Backend:/app
      - /app/node_modules
    depends_on:
      - mongodb
      - redis
    networks:
      - taskflow_network

  # ==========================================
  # Email Queue Worker Service (Development)
  # ==========================================
  worker:
    build:
      context: ./Backend
      dockerfile: Dockerfile.dev
    container_name: taskflow_worker_dev
    restart: always
    command: bun --watch src/modules/email/email.worker.js
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - MONGO_URI=${MONGO_URI}
      - REDIS_URL=${REDIS_URL}
      - EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS}
      - EMAIL_LOGO_URL=${EMAIL_LOGO_URL:-https://res.cloudinary.com/kccnqqnu/image/upload/logo_qkcs9p.png}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - APP_BASE_URL=${APP_BASE_URL}
    volumes:
      - ./Backend:/app
      - /app/node_modules
    depends_on:
      - mongodb
      - redis
    networks:
      - taskflow_network

  # ==========================================
  # Frontend UI Service (Development)
  # ==========================================
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile.dev
    container_name: taskflow_frontend_ui_dev
    restart: always
    ports:
      - '${FRONTEND_DEV_PORT:-5173}:5173'
    environment:
      - VITE_API_URL=${VITE_API_URL}
    volumes:
      - ./Frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - taskflow_network

# ==========================================
# Persistent volumes config
# ==========================================
volumes:
  mongo_data_dev:
  redis_data_dev:

# ==========================================
# Network configuration
# ==========================================
networks:
  taskflow_network:
    driver: bridge
