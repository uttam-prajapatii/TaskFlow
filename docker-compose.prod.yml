services:
  # ==========================================
  # Database Service (MongoDB)
  # ==========================================
  mongodb:
    image: mongo:6.0
    container_name: taskflow_mongodb_prod
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data_prod:/data/db
    networks:
      - taskflow_network

  # ==========================================
  # Caching Service (Redis)
  # ==========================================
  redis:
    image: redis:7.0-alpine
    container_name: taskflow_redis_prod
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data_prod:/data
    networks:
      - taskflow_network

  # ==========================================
  # Backend API Service (Production)
  # ==========================================
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: taskflow_backend_prod
    restart: always
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=5000
      - MONGO_URI=${MONGO_URI}
      - REDIS_URL=${REDIS_URL}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_ACCESS_EXPIRY=${JWT_ACCESS_EXPIRY}
      - JWT_REFRESH_EXPIRY=${JWT_REFRESH_EXPIRY}
      - JWT_ACCESS_COOKIE_NAME=${JWT_ACCESS_COOKIE_NAME}
      - JWT_REFRESH_COOKIE_NAME=${JWT_REFRESH_COOKIE_NAME}
    depends_on:
      - mongodb
      - redis
    networks:
      - taskflow_network

  # ==========================================
  # Frontend UI Service (Production)
  # ==========================================
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: taskflow_frontend_ui_prod
    restart: always
    ports:
      - "${FRONTEND_PROD_PORT:-3000}:80"
    environment:
      - VITE_API_URL=${VITE_API_URL}
    depends_on:
      - backend
    networks:
      - taskflow_network

# ==========================================
# Persistent volumes config
# ==========================================
volumes:
  mongo_data_prod:
  redis_data_prod:

# ==========================================
# Network configuration
# ==========================================
networks:
  taskflow_network:
    driver: bridge
