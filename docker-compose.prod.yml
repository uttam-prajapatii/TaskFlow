services:
  # ==========================================
  # Database Service (MongoDB)
  # ==========================================
  mongodb:
    image: mongo:6.0
    container_name: taskflow_mongodb_prod
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data_prod:/data/db
    networks:
      - taskflow_network

  # ==========================================
  # Caching Service (Redis)
  # ==========================================
  redis:
    image: redis:7.0-alpine
    container_name: taskflow_redis_prod
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data_prod:/data
    networks:
      - taskflow_network

  # ==========================================
  # Backend API Service (Production)
  # ==========================================
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: taskflow_backend_prod
    restart: always
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=5000
      - MONGO_URI=${MONGO_URI}
      - REDIS_URL=${REDIS_URL}
      - EMAIL_LOGO_URL=${EMAIL_LOGO_URL}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_ACCESS_EXPIRY=${JWT_ACCESS_EXPIRY}
      - JWT_REFRESH_EXPIRY=${JWT_REFRESH_EXPIRY}
      - JWT_ACCESS_COOKIE_NAME=${JWT_ACCESS_COOKIE_NAME}
      - JWT_REFRESH_COOKIE_NAME=${JWT_REFRESH_COOKIE_NAME}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - AUTH_RATE_LIMIT_WINDOW_MS=${AUTH_RATE_LIMIT_WINDOW_MS}
      - AUTH_RATE_LIMIT_MAX=${AUTH_RATE_LIMIT_MAX}
      - REFRESH_RATE_LIMIT_WINDOW_MS=${REFRESH_RATE_LIMIT_WINDOW_MS}
      - REFRESH_RATE_LIMIT_MAX=${REFRESH_RATE_LIMIT_MAX}
      - APP_BASE_URL=${APP_BASE_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_CALLBACK_URL=${GITHUB_CALLBACK_URL}
    depends_on:
      - mongodb
      - redis
    networks:
      - taskflow_network

  # ==========================================
  # Email Queue Worker Service (Production)
  # ==========================================
  worker:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: taskflow_worker_prod
    restart: always
    command: bun src/modules/email/email.worker.js
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - MONGO_URI=${MONGO_URI}
      - REDIS_URL=${REDIS_URL}
      - EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - APP_BASE_URL=${APP_BASE_URL}
    depends_on:
      - mongodb
      - redis
    networks:
      - taskflow_network

  # ==========================================
  # Frontend UI Service (Production)
  # ==========================================
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: taskflow_frontend_ui_prod
    restart: always
    ports:
      - "${FRONTEND_PROD_PORT:-3000}:80"
    environment:
      - VITE_API_URL=${VITE_API_URL}
    depends_on:
      - backend
    networks:
      - taskflow_network

# ==========================================
# Persistent volumes config
# ==========================================
volumes:
  mongo_data_prod:
  redis_data_prod:

# ==========================================
# Network configuration
# ==========================================
networks:
  taskflow_network:
    driver: bridge
